<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>给你的惊喜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            overflow: hidden; 
            font-family: 'Microsoft YaHei', sans-serif;
            touch-action: none; /* 防止手机端滑动 */
        }
        .popup {
            position: absolute;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 14px;
            font-weight: bold;
            color: #333;
            user-select: none;
            cursor: pointer;
            /* 使用 translate 居中，更利于画心形 */
            transform: translate(-50%, -50%) scale(1);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: opacity 0.3s; /* 这里控制消失时的淡出动画 */
            white-space: nowrap;
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        #tip {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 16px;
            z-index: -1;
            transform: translateY(-50%);
        }
    </style>
</head>
<body>

    <div id="tip">点我屏幕任何地方开始</div>

    <script>
        const messages = ["多喝水呀 💧", "好好爱自己 ❤️", "好好吃饭 🍚", "保持好心情 😊", "我想你了 ✨", "顺顺利利 🍀", "别熬夜 🌙", "天凉了多穿衣服 🧣"];
        const colors = ["#FFB6C1", "#ADD8E6", "#90EE90", "#FFFACD", "#FF69B4", "#87CEEB", "#E0FFFF"];
        
        let isRunning = false;
        let heartPopups = []; // 存放爱心弹窗

        // 数学方程计算坐标
        function getHeartPoint(t, scale) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale };
        }

        // 创建弹窗
        function createPopup(x, y, text, bgColor, isHeartObj = false) {
            const div = document.createElement('div');
            div.className = 'popup';
            div.innerText = text;
            div.style.backgroundColor = bgColor;
            div.style.left = `${x}px`;
            div.style.top = `${y}px`;

            div.onclick = function(e) {
                e.stopPropagation();
                div.remove();
            };

            document.body.appendChild(div);
            if(isHeartObj) heartPopups.push(div);
            return div;
        }

        // 核心动画流程
        function startSequence() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('tip').style.display = 'none';

            const w = window.innerWidth;
            const h = window.innerHeight;
            
            const scale = Math.min(w, h) / 45; 
            const n = 50; 

            // 第一阶段：生成爱心
            for (let i = 0; i < n; i++) {
                setTimeout(() => {
                    let t = (i / n) * 2 * Math.PI;
                    let pt = getHeartPoint(t, scale);
                    let px = w / 2 + pt.x;
                    let py = h / 2 + pt.y - 30; 

                    let text = (i === n - 1) ? "充实自己 🌟" : messages[Math.floor(Math.random() * messages.length)];
                    let color = colors[Math.floor(Math.random() * colors.length)];

                    createPopup(px, py, text, color, true);
                }, i * 50); // 成型速度
            }

            const heartDrawTime = n * 50; 

            // 第二阶段：停留1秒后，爱心开始【依次】消失，接着【极速】爆发全屏
            setTimeout(() => {
                
                // 【优化点1】：按顺序让爱心依次透明、消失
                heartPopups.forEach((p, index) => {
                    setTimeout(() => {
                        p.style.opacity = '0'; // 触发 CSS 渐隐动画
                        setTimeout(() => p.remove(), 300); // 动画结束后彻底移除
                    }, index * 25); // 这里控制依次消失的节奏，25ms一条
                });

                // 计算爱心全部消失需要花费的总时间
                const heartDisappearTime = heartPopups.length * 25 + 300;

                // 【优化点2】：等爱心消散完，满屏弹窗极速爆发
                setTimeout(() => {
                    // 动态计算需要多少个弹窗铺满当前手机屏幕
                    let totalPopups = Math.floor((w / 150) * (h / 40)) + 50;
                    
                    for (let i = 0; i < totalPopups; i++) {
                        // 使用极短的延迟（10ms）制造出瞬间爆发铺满的效果
                        setTimeout(() => {
                            let text = messages[Math.floor(Math.random() * messages.length)];
                            let color = colors[Math.floor(Math.random() * colors.length)];
                            
                            let px = Math.random() * (w - 100) + 50;
                            let py = Math.random() * (h - 50) + 25;
                            
                            createPopup(px, py, text, color, false);
                        }, i * 10); 
                    }
                }, heartDisappearTime);

            }, heartDrawTime + 1000); // 停留1秒开始消失流程
        }

        document.body.onclick = startSequence;
    </script>
</body>
</html>
